server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:online_shop}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  cache:
    type: redis
    redis:
      time-to-live: 3600000ms

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

logging:
  level:
    com.shop: ${LOG_LEVEL:INFO}
    org.springframework.data.redis: WARN
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"

app:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration: 86400000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: Redis Online Shop
    description: Redis-backed online shop API with carts, orders and stock protection
